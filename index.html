<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Preventive &amp; Social Medicine — Viva Question Bank</title>
  <meta name="description" content="Second Term Viva Question Bank, Solved. Preventive &amp; Social Medicine study platform for MBBS students, Netrokona Medical College.">
  <meta name="theme-color" content="#241A24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>try { if (JSON.parse(localStorage.getItem('psmqb:v1:theme')) === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>

  <!-- Fonts: Newsreader (headings) and Instrument Sans (body). Falls back to system serif/sans when offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&amp;display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Contents"></aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="shell">
      <header class="topbar" id="topbar">
        <button type="button" class="btn tb-contents" id="btn-contents" aria-controls="sidebar" aria-expanded="true">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Contents</span>
        </button>

        <button type="button" class="btn tb-exit" id="btn-exit-focus" hidden>Exit Focus Mode</button>
        <span class="tb-focus-info" id="focus-info" hidden></span>

        <div class="search" id="search-wrap" role="search">
          <label class="sr-only" for="search">Search all questions and answers</label>
          <svg class="search-ico" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search questions and answers" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="search-pop" aria-autocomplete="list">
          <div class="search-pop" id="search-pop" role="listbox" aria-label="Search results" hidden></div>
        </div>
        <button type="button" class="btn tb-searchbtn" id="btn-search-toggle" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>

        <div class="fontctl" role="group" aria-label="Reading size">
          <button type="button" id="font-dec" aria-label="Decrease text size">A<span aria-hidden="true">&minus;</span></button>
          <button type="button" id="font-reset" class="fontctl-val" aria-label="Reset text size to default" title="Reset to default size">100%</button>
          <button type="button" id="font-inc" aria-label="Increase text size">A+</button>
        </div>

        <button type="button" class="btn tb-theme" id="btn-theme" aria-pressed="false" aria-label="Night mode" title="Night mode">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Night</span>
        </button>
        <button type="button" class="btn tb-focus" id="btn-focus" aria-pressed="false">Focus mode</button>
      </header>

      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

      <main id="main" tabindex="-1"></main>

      <footer class="foot" id="foot">
        <p>Created by Muhtasim Ahmed &middot; Netrokona Medical College &middot; Session 22–23</p>
      </footer>
    </div>

    <div class="focus-bar" id="focus-bar"></div>
    <button type="button" class="totop" id="totop" aria-label="Back to top" hidden>Top ↑</button>
  </div>

  <div class="sr-only" id="live" aria-live="polite" role="status"></div>
  <noscript><p class="noscript">This question bank needs JavaScript to run. Please enable it in your browser.</p></noscript>

  <script src="js/data.js"></script>
  <!-- topics:start -->
  <script src="topics/01-environment-and-health.js"></script>
  <script src="topics/02-public-health-administration-and-management.js"></script>
  <script src="topics/03-epidemiology-of-non-communicable-and-communicable-diseases.js"></script>
  <script src="topics/04-mch-fp-and-demography.js"></script>
  <script src="topics/05-school-health-services.js"></script>
  <script src="topics/06-occupational-health.js"></script>
  <!-- topics:end -->
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ink.js?v=3"></script>
</body>
</html>
